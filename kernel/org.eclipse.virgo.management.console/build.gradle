jar.manifest.attributes(
        '-wab': 'src/main/webapp'
)

dependencies {
    implementation 'javax.servlet:javax.servlet-api'

    compile group: "org.eclipse", name: "osgi", version: equinoxVersion, configuration: "compile", ext: "jar"
    implementation group: 'org.eclipse.birt.runtime.3_7_1', name: 'org.eclipse.osgi.services' , version: osgiServicesVersion
    // implementation group: 'org.eclipse.gemini.management', name: 'org.eclipse.gemini.management', version: geminiManagementVersion
    implementation files('../../local-dependencies/org.eclipse.gemini.management-1.0.5.RELEASE.jar')

    implementation 'commons-fileupload:commons-fileupload'
    compile group: "org.jolokia", name: "jolokia-osgi", version: jolokiaVersion, ext: "jar"

    testImplementation 'org.slf4j:slf4j-nop'
    testImplementation 'org.springframework:spring-core'
    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.springframework:spring-test'
    testCompile group: "org.eclipse.virgo.mirrored", name: "org.mozilla.javascript", version: mozillaJavascriptVersion, configuration: "compile", ext: "jar"
    testCompile 'commons-io:commons-io'
}
