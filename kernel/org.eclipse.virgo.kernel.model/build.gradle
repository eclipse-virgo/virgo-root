dependencies {
    testImplementation 'org.springframework:spring-context'

    testCompile project(':test:org.eclipse.virgo.test.stubs')
    testCompile project(':kernel:org.eclipse.virgo.kernel.stubs')

    testRuntime group: "org.eclipse.virgo.mirrored", name: "org.eclipse.osgi.services", version: osgiServicesVersion, configuration: "compile", ext: "jar"

    compile group: "org.eclipse", name: "osgi", version: equinoxVersion, configuration: "compile", ext: "jar"
    //implementation group: 'org.eclipse.osgi', name: 'org.eclipse.equinox.cm', version: equinoxCmVersion
    implementation group: 'org.eclipse.platform', name: 'org.eclipse.equinox.cm', version: '1.1.200'

    implementation group: 'org.eclipse.equinox', name: 'org.eclipse.equinox.region', version: equinoxRegionVersion

    compile project(':kernel:org.eclipse.virgo.kernel.osgi')
    compile project(':kernel:org.eclipse.virgo.kernel.deployer')
    aspect project(':medic:org.eclipse.virgo.medic')
    aspect project(':nano:org.eclipse.virgo.nano.core')
    compile project(':nano:org.eclipse.virgo.nano.deployer.api')
    aspect project(':util:org.eclipse.virgo.util.jmx')
}
